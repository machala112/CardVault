<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardValidator — Verify Your Card</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ░░░ BACKGROUND ░░░ -->
  <div class="bg-layer">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <canvas id="bg-canvas"></canvas>
  </div>

  <!-- ░░░ NAVBAR ░░░ -->
  <nav class="navbar glass-panel">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="5" width="20" height="14" rx="3"/>
          <path d="M2 10h20"/>
          <path d="M6 15h4"/>
          <path d="M14 15h4"/>
        </svg>
      </div>
      <span class="brand-name">CardValidator</span>
    </div>
    <div class="nav-status" id="navStatus">
      <span class="status-dot"></span>
      <span class="status-text">Live System</span>
    </div>
  </nav>

  <!-- ░░░ APP VIEW (rendered by app.js) ░░░ -->
  <main id="view"></main>

  <!-- ░░░ FOOTER ░░░ -->
  <footer class="footer">
    <p>© 2026 CardValidator · Secure · Instant · Reliable</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
