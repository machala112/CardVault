name: Build Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: admin-apk
        run: npm install

      - name: Write google-services.json (Firebase)
        working-directory: admin-apk
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON repo secret is empty or missing."
            echo "Add your Firebase google-services.json file content as a repo secret named GOOGLE_SERVICES_JSON (Settings → Secrets → Actions)."
            exit 1
          fi
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: Eject Expo to get android folder
        working-directory: admin-apk
        run: CI=1 npx expo prebuild --platform android --non-interactive

      - name: Write API config
        working-directory: admin-apk
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.APP_BACKEND_URL }}" >> .env

      - name: Build APK with Gradle
        working-directory: admin-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CardValidator-APK
          path: admin-apk/android/app/build/outputs/apk/release/*.apk
