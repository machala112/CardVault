name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'dashboard/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Bootstrap Cloudflare resources & deploy cardvault-api
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (Settings → Secrets and variables → Actions), then re-run this workflow."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm i -g wrangler

      - name: Ensure D1 database and R2 bucket exist
        id: bootstrap
        run: |
          DB_ID=$(wrangler d1 list --json 2>/dev/null | python3 -c "import json,sys; ds=json.load(sys.stdin); print(next((d['uuid'] for d in ds if d.get('name')=='cardvault-db'), ''))" 2>/dev/null || echo "")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database cardvault-db…"
            DB_ID=$(wrangler d1 create cardvault-db 2>&1 | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          else
            echo "D1 database cardvault-db already exists"
          fi
          if [ -z "$DB_ID" ]; then echo "::error::Could not determine the D1 database ID"; exit 1; fi
          echo "D1 database id: $DB_ID"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          if wrangler r2 bucket list 2>/dev/null | grep -qw 'cardvault-images'; then
            echo "R2 bucket cardvault-images already exists"
          else
            echo "Creating R2 bucket cardvault-images…"
            wrangler r2 bucket create cardvault-images
          fi

      - name: Wire D1 database ID into wrangler.toml
        run: |
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ steps.bootstrap.outputs.db_id }}/" wrangler.toml
          fi
          grep -A3 '\[\[d1_databases\]\]' wrangler.toml

      - name: Apply D1 migrations
        run: wrangler d1 execute cardvault-db --file workers/api/migrations/0001_init.sql --remote

      - name: Set worker secrets
        run: |
          if [ -n "$FCM_JSON" ]; then
            printf '%s' "$FCM_JSON" | wrangler secret put FCM_SERVICE_ACCOUNT_JSON
            echo "FCM_SERVICE_ACCOUNT_JSON set"
          else
            echo "::warning::FCM_SERVICE_ACCOUNT_JSON repo secret is not set — push notifications stay disabled until it is added."
          fi
          if [ -n "$FIREBASE_WEB_API_KEY" ]; then
            printf '%s' "$FIREBASE_WEB_API_KEY" | wrangler secret put FIREBASE_WEB_API_KEY
            echo "FIREBASE_WEB_API_KEY set"
          else
            echo "::warning::FIREBASE_WEB_API_KEY repo secret is not set — sign-in will not work until it is added."
          fi
          if [ -n "$ADMIN_EMAIL" ]; then
            printf '%s' "$ADMIN_EMAIL" | wrangler secret put ADMIN_EMAIL
            echo "ADMIN_EMAIL set"
          else
            echo "::warning::ADMIN_EMAIL repo secret is not set — nobody becomes admin on sync until it is added."
          fi
        env:
          FCM_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

      - name: Deploy worker
        run: wrangler deploy
